name: Build & Release

on:
  push:
    tags: ["v*"]
    branches: ["windows-support"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./engine/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: engine-mac
          path: plugin/com.saap.audio.sdPlugin/bin/saap-engine

  engine-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path engine-rs/Cargo.toml
      # protocol: the engine must answer "ready" and then exit cleanly
      - name: Startup test
        shell: pwsh
        run: |
          $out = '{"cmd":"quit"}' | & engine-rs/target/release/saap-engine.exe
          Write-Host $out
          if ($out -notmatch '"evt":"ready"') { throw "the engine did not answer ready" }
      # decoding of a file + device list (the CI server may have no sound card: the list can be empty)
      - name: Decoding and devices test
        shell: pwsh
        run: |
          python -c "import wave,struct,math; w=wave.open('t.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh',int(8000*math.sin(i/20)),int(8000*math.sin(i/20))) for i in range(44100*2))); w.close()"
          $wav = (Resolve-Path t.wav).Path -replace '\\','/'
          $cmds = @('{"cmd":"devices"}', ('{"cmd":"peaks","req":1,"file":"' + $wav + '","n":10}'), '{"cmd":"peaks","req":2,"file":"absent.wav"}')
          $out = & { $cmds; Start-Sleep 2; '{"cmd":"quit"}' } | & engine-rs/target/release/saap-engine.exe
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -match '"evt":"devices"')) { throw "no answer to the devices command" }
          if (-not ($out -match '"duration":2\.0')) { throw "waveform not computed" }
          if (-not ($out -match '"error":"Unreadable file"')) { throw "the missing-file error was not returned" }
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine-rs/target/release/saap-engine.exe

  package:
    needs: [engine-mac, engine-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: engine-mac
          path: plugin/com.saap.audio.sdPlugin/bin
      - uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: plugin/com.saap.audio.sdPlugin/bin
      # a release whose manifest does not target Windows (e.g. the stable macOS releases) must not ship the .exe
      - name: Drop the Windows engine when the manifest does not target Windows
        run: |
          if ! grep -q '"Platform": "windows"' plugin/com.saap.audio.sdPlugin/manifest.json; then
            rm -f plugin/com.saap.audio.sdPlugin/bin/saap-engine.exe
            echo "manifest has no Windows target: engine .exe removed"
          fi
      - name: Package .streamDeckPlugin
        run: |
          chmod +x plugin/com.saap.audio.sdPlugin/bin/saap-engine
          ./package.sh --no-engine
          unzip -l dist/com.saap.audio.streamDeckPlugin | grep -E "saap-engine|plugin.js"
      - uses: actions/upload-artifact@v4
        with:
          name: com.saap.audio.streamDeckPlugin
          path: dist/com.saap.audio.streamDeckPlugin
      - name: Attach to the release (on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag containing a dash (v0.2.0-beta.1) is published as a pre-release: it is not offered as the "latest release"
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
          gh release upload "$GITHUB_REF_NAME" dist/com.saap.audio.streamDeckPlugin --clobber
