<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Volume</title>
  <script src="sdpi-components.js"></script>
  <link rel="stylesheet" href="saap.css" />
</head>
<body>
  <header class="hero"><svg viewBox="0 0 36 36"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
<rect width="36" height="36" rx="9" fill="#1d2027"/><g fill="url(#lg)"><rect x="7" y="15" width="3" height="6" rx="1.5"/><rect x="12" y="10" width="3" height="16" rx="1.5"/><rect x="17" y="6" width="3" height="24" rx="1.5"/><rect x="22" y="12" width="3" height="12" rx="1.5"/><rect x="27" y="16" width="3" height="4" rx="1.5"/></g></svg><div><h1>Volume</h1><p>Master or per group of sounds</p></div></header>
  <h2 class="section">Setting</h2>
  <details class="card plain" open>
    <summary><span class="badge">♪</span><span class="meta"><span class="title">Live volume</span></span></summary>
    <div class="body">
    <sdpi-item label="Target"><sdpi-select setting="target" datasource="getGroupsVolume" loading="Loading…" default="*" placeholder="Master (all sounds)"></sdpi-select></sdpi-item>
    <sdpi-item label="Key"><sdpi-select setting="mode" default="up">
        <option value="up">Volume +</option>
        <option value="down">Volume −</option>
        <option value="mute">Mute / unmute</option>
        <option value="set">Set to a value</option>
      </sdpi-select></sdpi-item>
    <sdpi-item label="Step (%)"><sdpi-range setting="step" min="1" max="20" step="1" default="5" showlabels></sdpi-range></sdpi-item>
    <sdpi-item label="Fixed value (%)"><sdpi-range setting="value" min="0" max="100" step="1" default="100" showlabels></sdpi-range></sdpi-item>
    </div>
  </details>
  <sdpi-note>On a dial: rotate = volume, press or touch = mute. The step applies to each notch.</sdpi-note>

</body>
</html>
